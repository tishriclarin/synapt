name: Android build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - run: cargo test
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-37' 'ndk;28.2.13676358'
      - run: cargo install cargo-ndk --locked
      - run: cargo ndk -t arm64-v8a -t x86_64 -p 36 -o android/app/src/main/jniLibs build --release
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: synapt-debug
          path: android/app/build/outputs/apk/debug/*.apk
